<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra mật khẩu</title>
</head>
<body>
    <div class="container">
        <h2>Đăng ký tài khoản</h2>
        
        <label>Tên đăng nhập:</label>
        <input type="text" id="username" placeholder="Nhập username">
        
        <label>Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu">
        
        <div class="criteria">
            <strong>Điều kiện mật khẩu:</strong><br>
            - Ít nhất 8 ký tự<br>
            - Ít nhất 1 chữ hoa (A-Z)<br>
            - Ít nhất 1 chữ thường (a-z)<br>
            - Ít nhất 1 chữ số (0-9)<br>
            - Ít nhất 1 ký tự đặc biệt (@, #, $, %, ...)
        </div>
        
        <div id="message"></div>
        
        <button onclick="checkPassword()">Kiểm tra mật khẩu</button>
    </div>

    <script>
        function checkPassword() {
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let messageDiv = document.getElementById('message');
            
            if (username.trim() === '') {
                messageDiv.innerHTML = '<div class="error">Vui lòng nhập tên đăng nhập!</div>';
                return;
            }
            
            let errors = [];
            
            if (password.length < 8) {
                errors.push("Mật khẩu phải có ít nhất 8 ký tự");
            }
            
            if (!/[A-Z]/.test(password)) {
                errors.push("Mật khẩu phải chứa ít nhất 1 chữ hoa (A-Z)");
            }
            
            if (!/[a-z]/.test(password)) {
                errors.push("Mật khẩu phải chứa ít nhất 1 chữ thường (a-z)");
            }
            
            if (!/[0-9]/.test(password)) {
                errors.push("Mật khẩu phải chứa ít nhất 1 chữ số (0-9)");
            }
            
            let specialChars = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/;
            if (!specialChars.test(password)) {
                errors.push("Mật khẩu phải chứa ít nhất 1 ký tự đặc biệt (@, #, $, %, ...)");
            }
            
            if (errors.length > 0) {
                let errorHtml = '<div class="error">Mật khẩu không hợp lệ:<br>';
                for (let i = 0; i < errors.length; i++) {
                    errorHtml += '• ' + errors[i] + '<br>';
                }
                errorHtml += '</div>';
                messageDiv.innerHTML = errorHtml;
                return;
            }
            
            let strength = "";
            let strengthClass = "";
            
            if (password.length === 8) {
                strength = "Yếu";
                strengthClass = "weak";
            } else if (password.length >= 9 && password.length <= 11) {
                strength = "Trung bình";
                strengthClass = "medium";
            } else if (password.length >= 12) {
                strength = "Mạnh";
                strengthClass = "strong";
            }
            
            messageDiv.innerHTML = `<div class="success">Mật khẩu hợp lệ!<br>Độ mạnh: <span class="${strengthClass}">${strength}</span></div>`;
        }
    </script>
</body>
</html>
